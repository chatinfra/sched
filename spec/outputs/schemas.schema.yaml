$schema: https://json-schema.org/draft/2020-12/schema
type: object
required: [tool, schemas]
additionalProperties: false
properties:
  tool:
    const: sched
  schemas:
    type: array
    items:
      type: object
      required: [id, path, description]
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
        path:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
