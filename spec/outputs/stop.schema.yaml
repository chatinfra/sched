$schema: https://json-schema.org/draft/2020-12/schema
type: object
required: [scheduleId, serviceName, stopped]
additionalProperties: false
properties:
  scheduleId:
    type: string
    minLength: 1
  serviceName:
    type: string
  stopped:
    type: boolean
  message:
    type: string
  warnings:
    type: array
    items:
      type: string
