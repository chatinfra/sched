$schema: https://json-schema.org/draft/2020-12/schema
type: object
required: [command, summary, usage, schema]
additionalProperties: false
properties:
  command:
    type: string
    minLength: 1
  summary:
    type: string
    minLength: 1
  usage:
    type: string
    minLength: 1
  flags:
    type: array
    items:
      type: object
      required: [name, summary]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        summary:
          type: string
          minLength: 1
  schema:
    type: string
    minLength: 1
